name: Build Android APK (Phones & Android TV)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - 'renderer.js'
      - 'style.css'
      - 'index.html'
      - 'freetv_playlist.m3u'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Mobile & TV APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync web assets to Android assets
        run: |
          cp renderer.js android/app/src/main/assets/renderer.js
          cp style.css android/app/src/main/assets/style.css
          cp index.html android/app/src/main/assets/index.html
          cp freetv_playlist.m3u android/app/src/main/assets/freetv_playlist.m3u

      - name: Setup Gradle Wrapper and Build APKs
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleMobileDebug assembleTvDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk release-apk/FreeTV.Android.Mobile.1.0.0.apk
          cp android/app/build/outputs/apk/tv/debug/app-tv-debug.apk release-apk/FreeTV.Android.TV.1.0.0.apk
          cp release-apk/FreeTV.Android.Mobile.1.0.0.apk release-apk/FreeTV.Setup.Android.1.0.0.apk
          ls -lh release-apk/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FreeTV-Android-v1.0.0
          path: release-apk/*.apk

      - name: Attach APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: FreeTV Player v1.0.0 (Windows, Mobile & Android TV)
          body_path: RELEASE_NOTES.md
          files: |
            release-apk/FreeTV.Android.Mobile.1.0.0.apk
            release-apk/FreeTV.Android.TV.1.0.0.apk
            release-apk/FreeTV.Setup.Android.1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
