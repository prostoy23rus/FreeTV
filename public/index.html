<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeTV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">🐼</div>
        <div class="brand-text">
          <h1>FreeTV</h1>
          <span class="badge" id="channel-count">0 каналов</span>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="Поиск каналов...">
        <button id="clear-search" class="icon-btn" title="Очистить">&times;</button>
      </div>

      <!-- Categories Navigation -->
      <div class="categories-container">
        <h3>Категории</h3>
        <ul id="categories-list" class="nav-list">
          <li class="active" data-group="all">
            <span class="icon">📺</span>
            <span class="title">Все каналы</span>
            <span class="count" id="all-count">0</span>
          </li>
          <li data-group="favorites">
            <span class="icon">⭐</span>
            <span class="title">Избранное</span>
            <span class="count" id="fav-count">0</span>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <button id="btn-reload" class="secondary-btn" title="Обновить плейлист">🔄 Обновить</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Player Section -->
      <div class="player-container" id="player-container">
        <video id="video-player" controls autoplay playsinline></video>
        
        <div class="player-overlay" id="player-overlay">
          <div class="current-info">
            <img id="current-logo" src="" alt="" class="channel-logo-large hidden">
            <div>
              <h2 id="current-title">Выберите канал для просмотра</h2>
              <p id="current-group">Ожидание выбора...</p>
            </div>
          </div>
          <div class="player-controls">
            <button id="btn-fav-toggle" class="control-btn" title="В избранное">⭐</button>
            <button id="btn-pip" class="control-btn" title="Картинка в картинке">🪟</button>
            <button id="btn-fullscreen" class="control-btn" title="Полноэкранный режим">⛶</button>
          </div>
        </div>
        
        <div class="player-status hidden" id="player-status">Загрузка потока...</div>
      </div>

      <!-- Channel Grid / List -->
      <div class="channels-section">
        <div class="section-header">
          <h2 id="section-title">Все каналы</h2>
          <span id="filtered-count" class="badge">0</span>
        </div>
        <div class="channels-grid" id="channels-grid">
          <!-- Dynamically populated -->
        </div>
      </div>
    </main>
  </div>

  <script src="hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
