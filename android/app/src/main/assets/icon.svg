<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="17" y="17" width="222" height="222" rx="51" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>

  <!-- TV Display Bezel -->
  <rect x="42" y="60" width="172" height="124" rx="24" fill="#090e1c" stroke="#1e293b" stroke-width="4"/>
  
  <!-- TV Antenna Lines -->
  <path d="M78 38L108 58M178 38L148 58" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Play Triangle Icon -->
  <path d="M112 96L166 122L112 148V96Z" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Status LED -->
  <circle cx="186" cy="78" r="4" fill="#38bdf8" filter="url(#glow)"/>
  
  <!-- Stand Base -->
  <path d="M96 204H160M128 184V204" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round"/>
</svg>
